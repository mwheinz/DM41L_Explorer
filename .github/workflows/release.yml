name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Builds a standalone binary on Linux (x86_64 and arm64), macOS, and
# Windows via build.sh / dm41l.spec, zips each one up with a checksum, and
# publishes them all to a GitHub Release named after the tag.
#
# PyInstaller can't cross-compile, so the arm64 build needs its own native
# runner rather than a flag on the x86_64 leg: ubuntu-24.04-arm is a
# GitHub-hosted Linux ARM64 runner, free and unlimited on public repos as
# of GA 2025-08-07.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # build.sh embeds `git describe --tags` as the app version, which
          # needs real tag history, not the default shallow clone.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # See test.yml: works around an intermittent broken Tcl/Tk bundle
          # in the pre-baked Windows runner Python tool cache.
          check-latest: true

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build
        shell: bash
        run: src/build.sh

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Both the x86_64 and arm64 legs hit this step (runner.os reads
          # "Linux" for either), so the filename has to reflect the actual
          # host arch rather than assuming x86_64 -- otherwise the two
          # legs would produce identically-named zips that collide when
          # the publish job merges all artifacts into one directory.
          case "$(uname -m)" in
            x86_64) ARCH=x86_64 ;;
            aarch64) ARCH=arm64 ;;
            *) ARCH="$(uname -m)" ;;
          esac
          cd src/dist
          zip -r "../../DM41L-Explorer-${{ github.ref_name }}-linux-${ARCH}.zip" dm41lexplorer
          cd ../..
          sha256sum "DM41L-Explorer-${{ github.ref_name }}-linux-${ARCH}.zip" > "DM41L-Explorer-${{ github.ref_name }}-linux-${ARCH}.zip.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd src/dist
          7z a "../../DM41L-Explorer-${{ github.ref_name }}-windows-x86_64.zip" dm41lexplorer
          cd ../..
          sha256sum "DM41L-Explorer-${{ github.ref_name }}-windows-x86_64.zip" > "DM41L-Explorer-${{ github.ref_name }}-windows-x86_64.zip.sha256"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd src/dist
          ditto -c -k --sequesterRsrc --keepParent "DM41L Explorer.app" "../../DM41L-Explorer-${{ github.ref_name }}-macos.zip"
          cd ../..
          shasum -a 256 "DM41L-Explorer-${{ github.ref_name }}-macos.zip" > "DM41L-Explorer-${{ github.ref_name }}-macos.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: dm41l-explorer-${{ matrix.os }}
          path: |
            DM41L-Explorer-*.zip
            DM41L-Explorer-*.zip.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "DM41L Explorer ${{ github.ref_name }}" \
            --generate-notes
