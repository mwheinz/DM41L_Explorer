name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is a GitHub-hosted Linux ARM64 runner, free and
        # unlimited on public repos (like x64 runners) as of GA 2025-08-07.
        # Every step below keys off runner.os, which reads "Linux" for this
        # runner too, so no other changes are needed here.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # Works around an intermittent GitHub-hosted Windows runner issue
          # where the pre-baked Python in the image's tool cache has an
          # incomplete Tcl/Tk bundle (missing ttk/*.tcl files -> tkinter
          # import fails). check-latest makes the action verify the cached
          # copy is actually the newest matching release and re-download
          # otherwise, instead of trusting whatever's pre-installed as-is.
          check-latest: true

      - name: Install Linux GUI/test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests (Linux, headless via Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest

      - name: Run tests
        if: runner.os != 'Linux'
        run: pytest
