name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Builds a standalone binary on Linux, macOS, and Windows via build.sh /
# dm41l.spec, zips each one up with a checksum, and publishes them all to
# a GitHub Release named after the tag.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # build.sh embeds `git describe --tags` as the app version, which
          # needs real tag history, not the default shallow clone.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build
        shell: bash
        run: src/build.sh

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd src/dist
          zip -r "../../DM41L-Explorer-${{ github.ref_name }}-linux-x86_64.zip" dm41lexplorer
          cd ../..
          sha256sum "DM41L-Explorer-${{ github.ref_name }}-linux-x86_64.zip" > "DM41L-Explorer-${{ github.ref_name }}-linux-x86_64.zip.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd src/dist
          7z a "../../DM41L-Explorer-${{ github.ref_name }}-windows-x86_64.zip" dm41lexplorer
          cd ../..
          sha256sum "DM41L-Explorer-${{ github.ref_name }}-windows-x86_64.zip" > "DM41L-Explorer-${{ github.ref_name }}-windows-x86_64.zip.sha256"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd src/dist
          ditto -c -k --sequesterRsrc --keepParent "DM41L Explorer.app" "../../DM41L-Explorer-${{ github.ref_name }}-macos.zip"
          cd ../..
          shasum -a 256 "DM41L-Explorer-${{ github.ref_name }}-macos.zip" > "DM41L-Explorer-${{ github.ref_name }}-macos.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dm41l-explorer-${{ matrix.os }}
          path: |
            DM41L-Explorer-*.zip
            DM41L-Explorer-*.zip.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --title "DM41L Explorer ${{ github.ref_name }}" \
            --generate-notes
